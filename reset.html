<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nueva contraseña — RankeaPro</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
</head>
<body class="app">
<div class="wrap app">
<nav><div class="container"><a class="logo" href="index.html">&gt;_ <b>rankea</b>pro<span class="cur"></span></a></div></nav>
<main><div class="container"><div class="auth-box">
  <span class="cmd">./auth --reset</span>
  <div class="tabs"><button class="active">Nueva contraseña</button></div>
  <div class="panel">
    <form id="f">
      <div class="field"><label>nueva contraseña (mín. 8)</label><input type="password" name="password" minlength="8" required autocomplete="new-password"></div>
      <button class="btn btn-primary full" type="submit">guardar</button>
    </form>
    <div class="msg" id="msg"></div>
  </div>
</div></div></main>
</div>
<script src="app.js"></script>
<script>
if(!configurado) noConfig();
$('#f').onsubmit = async e => {
  e.preventDefault();
  const { error } = await sb.auth.updateUser({ password: new FormData(e.target).get('password') });
  if(error) return showMsg($('#msg'), error.message);
  showMsg($('#msg'), 'Contraseña actualizada. Redirigiendo…', 'ok');
  setTimeout(() => location.href = 'panel.html', 1200);
};
</script>
</body>
</html>
